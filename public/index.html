<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ESL Article Scaffolder</title>
    <link rel="stylesheet" href="assets/styles/tokens.css" />
    <link rel="stylesheet" href="assets/styles/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <img
        class="logo"
        src="assets/images/logo-esl-scaffolder-icon-size.svg"
        width="36"
        height="36"
        alt=""
      />
      <div>
        <a href="#/" class="brand">ESL Article Scaffolder</a>
        <p class="tagline">
          One article → reading packs at up to 3 grade levels you choose, with
          glossary and questions.
        </p>
      </div>
    </header>

    <main id="app">
      <!-- Home view: upload form + article list -->
      <section id="view-home" class="home-view">
        <!-- Built by upload-form.js once /api/config has loaded -->
        <div id="upload-form-container"></div>

        <section class="card">
          <div class="list-header">
            <h2>Articles</h2>
            <input
              type="search"
              id="search"
              placeholder="Search by title or uploader…"
              aria-label="Search articles"
            />
          </div>
          <ul id="article-list" class="article-list"></ul>
          <p id="empty-list" class="muted" hidden>No articles yet.</p>
        </section>
      </section>

      <!-- Detail view: one article and its files -->
      <section id="view-detail" hidden>
        <a href="#/" class="back">← All articles</a>
        <div id="detail"></div>
      </section>
    </main>

    <footer class="site-footer">
      <span id="usage">Today's usage: …</span>
    </footer>

    <script src="js/main.js" type="module"></script>
  </body>
</html>
